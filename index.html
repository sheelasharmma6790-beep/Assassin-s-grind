<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assassin's Grind Matrix</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(10, 15, 10, 0.9);
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            border-radius: 8px;
            padding: 25px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            text-shadow: 0 0 10px #00ff66;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: 0.3s ease;
        }
        button:hover {
            background: #00cc52;
            box-shadow: 0 0 15px #00ff66;
        }
        .status {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            min-height: 20px;
        }
        .task-card {
            border: 1px dashed #00ff66;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pts-badge {
            background: #00ff66;
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ Assassin Matrix ⚔️</h1>
    <hr style="border: 1px solid #00ff66; margin-bottom: 20px;">
    
    <div id="authPanel">
        <h2>Initialize Profile</h2>
        <div class="form-group">
            <label>Codename:</label>
            <input type="text" id="codenameInput" placeholder="Enter Assassin Codename...">
        </div>
        <div class="form-group">
            <label>Age:</label>
            <input type="number" id="ageInput" placeholder="Enter Age...">
        </div>
        <div class="form-group">
            <label>Class Unit / Country:</label>
            <input type="text" id="classInput" placeholder="e.g., Belgium Unit...">
        </div>
        <button id="initializeBtn">Initialize Sync Protocol</button>
    </div>

    <div id="statusDisplay" class="status"></div>

    <div id="mainSystem" style="display: none;">
        <h2>Active Core Protocol</h2>
        <p><strong>Agent:</strong> <span id="displayAgent">-</span></p>
        <p><strong>Rank Status:</strong> <span id="displayRank">5th Rank: Beginner 🛡️</span></p>
        <p><strong>Matrix Score:</strong> <span id="displayPoints" style="font-size: 20px; font-weight: bold;">0</span> PTS</p>
        
        <hr style="border: 1px dashed #00ff66; margin: 20px 0;">
        <h3>Available Grinds</h3>
        
        <div class="task-card">
            <div>
                <span class="pts-badge">+10 PTS</span>
                <p style="margin: 5px 0 0 0;">Daily Physical Conditioning Routine</p>
            </div>
            <button style="width: auto; padding: 5px 15px;" onclick="addPointsAction(10)">+PTS</button>
        </div>

        <div class="task-card">
            <div>
                <span class="pts-badge">+25 PTS</span>
                <p style="margin: 5px 0 0 0;">Complete Intelligence Coding Task</p>
            </div>
            <button style="width: auto; padding: 5px 15px;" onclick="addPointsAction(25)">+PTS</button>
        </div>
    </div>
</div>

<script>
// Live Render Backend Connection URL
const BACKEND_URL = "https://assassin-s-grind.onrender.com";

let applicationState = {
    name: "",
    age: "",
    classUnit: "",
    points: 0,
    rank: "5th Rank: Beginner 🛡️"
};

document.getElementById('initializeBtn').addEventListener('click', async () => {
    const name = document.getElementById('codenameInput').value.trim();
    const age = document.getElementById('ageInput').value.trim();
    const classUnit = document.getElementById('classInput').value.trim() || "Unknown";
    const statusDisplay = document.getElementById('statusDisplay');

    if (!name || !age) {
        statusDisplay.style.color = "#ff3333";
        statusDisplay.innerText = "❌ ERROR: Missing credentials!";
        return;
    }

    statusDisplay.style.color = "#00ff66";
    statusDisplay.innerText = "⏳ Connecting to Render protocol...";

    try {
        const response = await fetch(`${BACKEND_URL}/`);
        if (response.ok) {
            statusDisplay.innerText = "🎉 Profile Connected to Python Backend Server!";
            
            applicationState.name = name;
            applicationState.age = age;
            applicationState.classUnit = classUnit;
            
            document.getElementById('authPanel').style.display = "none";
            document.getElementById('mainSystem').style.display = "block";
            document.getElementById('displayAgent').innerText = `${name} (${classUnit})`;
        } else {
            statusDisplay.style.color = "#ff3333";
            statusDisplay.innerText = "❌ SERVER ERROR: Sync protocol rejected.";
        }
    } catch (error) {
        statusDisplay.style.color = "#ff3333";
        statusDisplay.innerText = "❌ CONNECTION FAILED: Server waking up, retry in 10 seconds!";
    }
});

function addPointsAction(pts) {
    applicationState.points += pts;
    document.getElementById('displayPoints').innerText = applicationState.points;
    
    const statusDisplay = document.getElementById('statusDisplay');
    statusDisplay.style.color = "#00ff66";
    statusDisplay.innerText = `🎯 Database Synced: Added +${pts} Points!`;
}
</script>

</body>
</html>
